<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a40"/>
      <stop offset="60%" stop-color="#ff5e36"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Dark Squircle Container with subtle border -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#252d42" stroke-width="1.5"/>

  <!-- Academic Poster Silhouette -->
  <!-- Top Header Poster in radiant gradient -->
  <rect x="14" y="12" width="36" height="12" rx="3" fill="url(#glow)"/>

  <!-- Left Column (Crisp ivory/white card with structural lines) -->
  <rect x="14" y="27" width="16.5" height="25" rx="3" fill="#ffffff" fill-opacity="0.94"/>
  <rect x="17" y="32" width="10.5" height="2" rx="1" fill="#141824" fill-opacity="0.75"/>
  <rect x="17" y="37" width="10.5" height="1.8" rx="0.9" fill="#141824" fill-opacity="0.45"/>
  <rect x="17" y="41.5" width="10.5" height="1.8" rx="0.9" fill="#141824" fill-opacity="0.45"/>
  <rect x="17" y="46" width="7" height="1.8" rx="0.9" fill="#141824" fill-opacity="0.45"/>

  <!-- Right Column (Vibrant neon gradient card with content lines) -->
  <rect x="33.5" y="27" width="16.5" height="25" rx="3" fill="url(#glow)"/>
  <rect x="36.5" y="32" width="10.5" height="2" rx="1" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="36.5" y="37" width="10.5" height="1.8" rx="0.9" fill="#ffffff" fill-opacity="0.65"/>
  <rect x="36.5" y="41.5" width="10.5" height="1.8" rx="0.9" fill="#ffffff" fill-opacity="0.65"/>
  <rect x="36.5" y="46" width="7" height="1.8" rx="0.9" fill="#ffffff" fill-opacity="0.65"/>
</svg>
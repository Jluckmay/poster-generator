[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poster-generator"
version = "1.0.0"
description = "Gerador de pôsteres acadêmicos em LaTeX (manual ou a partir do trabalho, pt-BR/en-US)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "pypdf>=4.0.0",
    "flask>=3.0.0",
    "gunicorn>=21.2.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.4.0"]

[project.scripts]
poster-generator = "server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
